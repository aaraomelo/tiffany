server {
    listen 80;
    listen [::]:80;
    server_name goldenkingdom.patriatechnology.com;

    location /.well-known/acme-challenge/ { root /var/www/goldenkingdom; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name goldenkingdom.patriatechnology.com;

    ssl_certificate     /etc/letsencrypt/live/goldenkingdom/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenkingdom/privkey.pem;

    root /var/www/goldenkingdom;
    index index.html;

    # os assets do Vite tem HASH no nome (index-ABC123.js|css): conteudo unico por URL -> cache eterno
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # o app (SPA) e todo o resto (html, PDF, imagens) muda MANTENDO o nome no deploy:
    # revalida SEMPRE (ETag/Last-Modified -> 304 se igual, mas nunca serve versao velha no refresh)
    # o fork do repo tiffany, servido por dumb HTTP. TEM de vir antes do fallback do SPA:
    # sem isto o nginx devolve 200 + index.html para um objeto solto inexistente, e o git
    # tenta descomprimir HTML -> "inflate: data stream error". O clone recupera pelo packfile,
    # mas cospe dois erros. Aqui um objeto que não existe devolve 404, que é o que o git espera.
    location /repo.git/ {
        alias /var/www/goldenkingdom/repo.git/;
        gzip off;
        autoindex off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
