server {
    listen 80;
    listen [::]:80;
    server_name goldenkingdom.patriatechnology.com;

    location /.well-known/acme-challenge/ { root /var/www/goldenkingdom; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name goldenkingdom.patriatechnology.com;

    ssl_certificate     /etc/letsencrypt/live/goldenkingdom/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenkingdom/privkey.pem;

    root /var/www/goldenkingdom;
    index index.html;

    # os assets do Vite tem HASH no nome (index-ABC123.js|css): conteudo unico por URL -> cache eterno
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # o app (SPA) e todo o resto (html, PDF, imagens) muda MANTENDO o nome no deploy:
    # revalida SEMPRE (ETag/Last-Modified -> 304 se igual, mas nunca serve versao velha no refresh)
    # O ESPELHO SAIU DA JOGADA (2026-08-20): o repositório passou a privado e já não se
    # serve por dumb HTTP daqui. O bloco FICA, e continua a ser o prefixo mais longo — só
    # que agora para FECHAR: sem ele, /repo.git/qualquer-coisa cairia no fallback do SPA e
    # devolveria 200 + index.html, que é responder a quem já não tem nada aqui. 404 é a
    # resposta certa, e é a mesma regra de casamento a fazer o trabalho contrário.
    location /repo.git/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
