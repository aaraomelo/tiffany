# F0.5/F1: Host → $gk_tenant → X-Tenant. Mesmo contrato da plataforma (PRODUCT.md).
# map ≠ location ~ : não parte o trie de prefixos. Apex (sem 4º label) → vazio.
# Wildcard server_name continua desligado (cert do apex não cobre 4 labels).
map $host $gk_tenant {
    default "";
    ~*^(?<gk_slug>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.goldenkingdom\.patriatechnology\.com$ $gk_slug;
}

server {
    listen 80;
    listen [::]:80;
    server_name goldenkingdom.patriatechnology.com;

    location /.well-known/acme-challenge/ { root /var/www/goldenkingdom; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goldenkingdom.patriatechnology.com;

    # F0.5 borda: Nginx realiza; o motor cataloga (banco_tenant_u.js). Nginx ≠ motor.
    #   /          SPA (Golden Kingdom)
    #   /banco/    núcleo (ficheiros; cai no try_files de location /)
    #   = /canal   WSS (prefixo exacto — o SPA devolveria 200+HTML ao Upgrade)
    # Tenant = 1º label de *.goldenkingdom.patriatechnology.com
    #   foo.goldenkingdom... → tenant=foo → /
    #   goldenkingdom...     → ausência (não tenant=goldenkingdom)
    #   canal.patriatechnology.com → barramento, N/A como tenant GK
    # tenant ≠ id ≠ K_i. Wildcard catalogado; cert do apex ainda não cobre 4 labels.
    # Não activar server_name *.goldenkingdom… sem certificado que case.

    ssl_certificate     /etc/letsencrypt/live/goldenkingdom/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenkingdom/privkey.pem;

    root /var/www/goldenkingdom;
    index index.html;

    # os assets do Vite tem HASH no nome (index-ABC123.js|css): conteudo unico por URL -> cache eterno
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # o app (SPA) e todo o resto (html, PDF, imagens) muda MANTENDO o nome no deploy:
    # revalida SEMPRE (ETag/Last-Modified -> 304 se igual, mas nunca serve versao velha no refresh)
    # O ESPELHO SAIU DA JOGADA (2026-08-20): o repositório passou a privado e já não se
    # serve por dumb HTTP daqui. O bloco FICA, e continua a ser o prefixo mais longo — só
    # que agora para FECHAR: sem ele, /repo.git/qualquer-coisa cairia no fallback do SPA e
    # devolveria 200 + index.html, que é responder a quem já não tem nada aqui. 404 é a
    # resposta certa, e é a mesma regra de casamento a fazer o trabalho contrário.
    location /repo.git/ {
        return 404;
    }

    # Alias genérico do motor — não é o SPA. Prefixo exacto: o fallback
    # try_files devolveria 200+HTML ao Upgrade e o WSS morria. nginxb.c §N3.
    # X-Tenant: o browser não define cabeçalho no WSS; o nginx deriva do Host.
    location = /canal {
        proxy_pass http://127.0.0.1:47314;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Tenant $gk_tenant;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Tenant $gk_tenant always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}

# Alias genérico: o barramento não se chama goldenkingdom.
# Certificado: wildcard *.patriatechnology.com (não o de goldenkingdom).
server {
    listen 80;
    listen [::]:80;
    server_name canal.patriatechnology.com;

    location /.well-known/acme-challenge/ { root /var/www/goldenkingdom; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name canal.patriatechnology.com;

    ssl_certificate     /etc/letsencrypt/live/patriatechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patriatechnology.com/privkey.pem;

    location = / {
        default_type text/plain;
        return 200 "canal\n";
    }

    location = /canal {
        proxy_pass http://127.0.0.1:47314;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}

