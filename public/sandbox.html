<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔒 Modo Privado</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{margin:0;padding:0}body{overflow:hidden;background:#000}
    canvas{display:block;width:100vw;height:100vh}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
    .lock{font-size:48px;transition:all 1s ease}
    .status{position:fixed;bottom:30px;left:0;right:0;text-align:center;font-family:-apple-system,sans-serif;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="overlay"><div class="lock" id="lock">🔒</div></div>
  <div class="status" id="status">Ativando...</div>
  <script>
  const canvas=document.getElementById('c');
  const gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
  let aS=0,tS=0,time=0;

  if(gl){
    const fs=`
precision mediump float;
uniform float T,S;
uniform vec2 R;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float sdSphere(vec3 p,float r){return length(p)-r;}
float sdOct(vec3 p,float s){p=abs(p);return(p.x+p.y+p.z-s)*.577;}

float map(vec3 p){
  vec3 q=p;q.xz*=rot(T*.4);q.xy*=rot(T*.3);
  float oct=sdOct(q,.9)-.02;
  float core=sdSphere(p,.3+.05*sin(T*3.))-99.*(1.-S);
  float ring=abs(length(p.xz)-1.3)-.02;ring=max(ring,abs(p.y)-.015);
  vec3 p2=p;p2.xy*=rot(.7);
  float ring2=abs(length(p2.xz)-1.15)-.015;ring2=max(ring2,abs(p2.y)-.012);
  return min(oct,min(core,min(ring,ring2)));
}

vec3 norm(vec3 p){vec2 e=vec2(.002,0);
  return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  float ca=T*.12;
  vec3 ro=vec3(sin(ca)*3.5,1.5+sin(T*.15)*.3,cos(ca)*3.5);
  vec3 ww=normalize(-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+2.*ww);

  vec3 cA=vec3(.1,.95,.6),cI=vec3(.9,.12,.08);
  vec3 ac=mix(cI,cA,S),gw=mix(vec3(.4,.03,0),vec3(0,.3,.65),S);

  // Background
  vec3 col=vec3(.01,.01,.03)+uv.y*.02;

  // Raymarch (60 steps max)
  float t=0.;bool hit=false;
  for(int i=0;i<60;i++){float d=map(ro+rd*t);if(d<.001){hit=true;break;}t+=d;if(t>15.)break;}

  if(hit){
    vec3 p=ro+rd*t,n=norm(p);
    vec3 li=normalize(vec3(2,3,1));
    float diff=max(dot(n,li),0.);
    float spec=pow(max(dot(reflect(-li,n),-rd),0.),64.);
    float fres=pow(1.-abs(dot(n,-rd)),3.);

    // Glass: refract + fresnel
    vec3 rfr=refract(rd,n,1./1.5);
    vec3 rfl=reflect(rd,n);

    // Inner color from refracted direction
    vec3 inner=ac*(.3+.3*dot(rfr,li))+gw*.2;
    // Reflected env
    vec3 refl=gw*(.2+.3*max(rfl.y,0.));

    col=mix(inner,refl,fres);
    col+=spec*vec3(1)*.5;
    col+=ac*.1*diff;

    // Core glow bleeding through
    float coreDist=length(p);
    if(coreDist<.8) col+=ac*exp(-coreDist*5.)*S*2.;
  }

  // Atmospheric glow
  float cd=length(uv);
  col+=gw*exp(-cd*3.)*.35*S;
  col+=ac*exp(-cd*6.)*.15;

  // Tone map + vignette
  col=col/(col+vec3(1));
  col*=1.-cd*.35;
  col=pow(col,vec3(.9));

  gl_FragColor=vec4(col,1);
}`;

    function mk(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;}
    const p=gl.createProgram();
    gl.attachShader(p,mk(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}'));
    gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(p);gl.useProgram(p);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const a=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
    const uT=gl.getUniformLocation(p,'T'),uS=gl.getUniformLocation(p,'S'),uR=gl.getUniformLocation(p,'R');

    function resize(){
      const dpr=Math.min(devicePixelRatio,2); // cap DPR for performance
      canvas.width=window.innerWidth*dpr;canvas.height=window.innerHeight*dpr;
      gl.viewport(0,0,canvas.width,canvas.height);
    }
    window.addEventListener('resize',resize);resize();

    function render(){time+=.016;aS+=(tS-aS)*.025;
      gl.uniform1f(uT,time);gl.uniform1f(uS,aS);gl.uniform2f(uR,canvas.width,canvas.height);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(render);}
    render();
  }

  const tg=window.Telegram.WebApp,chatId=tg.initDataUnsafe?.user?.id;let sse=null;
  function setActive(){tS=1;document.getElementById('lock').textContent='🔒';
    document.getElementById('lock').style.filter='drop-shadow(0 0 30px rgba(74,222,128,.9))';
    document.getElementById('status').textContent='Modo privado ativo';}
  function setInactive(){tS=0;document.getElementById('lock').textContent='🔓';
    document.getElementById('lock').style.filter='drop-shadow(0 0 30px rgba(248,113,113,.9))';
    document.getElementById('status').textContent='Modo privado encerrado';}
  function connectSSE(){if(sse)try{sse.close();}catch{}
    sse=new EventSource('/api/sandbox/stream?chatId='+chatId);
    sse.onmessage=(e)=>{if(e.data==='close'){setInactive();setTimeout(()=>{try{tg.close();}catch{}},2000);}
      if(e.data==='connected')setActive();};
    sse.onerror=()=>{setInactive();setTimeout(connectSSE,3000);};}
  async function activate(){try{const r=await fetch('/api/sandbox/activate',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});
    const d=await r.json();if(d.ok){setActive();connectSSE();}
    else document.getElementById('status').textContent=d.error||'Erro';
  }catch(e){document.getElementById('status').textContent='Erro: '+e.message;}}
  if(tg.initData)activate();else document.getElementById('status').textContent='Abra pelo Telegram';
  </script>
</body>
</html>
