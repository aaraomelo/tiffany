# HOMOLOG do patria-erp: erp-homolog.patriatechnology.com → 127.0.0.1:8091
# Cert wildcard *.patriatechnology.com (já existente). Espelha o bloco do PROD (8090).
# Instalar em /etc/nginx/sites-available/erp-homolog.patriatechnology.com + symlink.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp-homolog.patriatechnology.com;

    ssl_certificate /etc/letsencrypt/live/patriatechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patriatechnology.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name erp-homolog.patriatechnology.com;
    return 301 https://$host$request_uri;
}
