name: Publicar na Patria

# O tiffany não tem app: o que ele publica são a TEORIA, o CATÁLOGO e o ENREDO, que o
# front do goldenkingdom serve. Portanto este workflow faz duas coisas e mais nenhuma:
#   1. espelha o repo no fork da Patria (o mesmo que o front oferece para clone);
#   2. compila os três papers e põe-nos no ar, direto.
#
# O ENREDO só entrou aqui em 02/08. Até então o enredo.pdf existia — 480 páginas — mas o
# .tex NÃO estava neste repositório: vivia em chess/sandbox/reino_dourado_enredo.tex, e o
# PDF era o que sobrara de uma compilação à mão. Ou seja, o único paper que a regra da
# linha de baixo NÃO cobria: o binário não subia, e a fonte também não. Um disco limpo
# reconstruía dois dos três.
#
# Nenhum binário sobe aqui: os .pdf são gerados no deploy, a partir dos .tex.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # o espelho quer a história toda

      - name: Os papers compilam? (portão antes de publicar)
        run: |
          # Os pacotes NÃO foram adivinhados: correu-se este passo num ubuntu:24.04 limpo, e
          # cada rodada disse qual era o ficheiro seguinte em falta. Três deles não estavam cá:
          #
          #   texlive-games          skak.sty — o enredo compõe tabuleiros, e é um livro de xadrez
          #   texlive-plain-generic  lambda.sty, que o skak.sty:29 pede num \RequirePackage
          #   cm-super               as Computer Modern ESCALÁVEIS em T1. Sem elas o LaTeX cai nas
          #                          EC em bitmap, e o microtype do enredo aborta com "auto
          #                          expansion is only possible with scalable fonts" — sem produzir
          #                          PDF nenhum. Teoria e catálogo não dão por isso: não usam
          #                          microtype, e a bitmap serve-lhes.
          #   poppler-utils          o pdfinfo — que ESTE passo já usava sem o ter instalado, e
          #                          por isso a contagem de páginas saía vazia em todas as
          #                          corridas anteriores. Não falhava: imprimia "✅ x.pdf ( páginas)".
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-portuguese texlive-science texlive-games texlive-plain-generic \
            cm-super poppler-utils
          # TRÊS passagens, não duas: o enredo tem um sumário de 480 páginas com capítulos de
          # três dígitos, e o número de páginas ainda muda entre a segunda e a terceira.
          # O `|| true` é o honesto: o pdflatex devolve não-zero por um Overfull \hbox, e quem
          # decide se compilou é o teste ao ficheiro — não o código de saída.
          for p in teoria catalogo enredo; do
            for i in 1 2 3; do
              pdflatex -interaction=nonstopmode "$p.tex" >/dev/null 2>&1 || true
            done
            test -s "$p.pdf" || { echo "❌ $p.pdf não compilou — não publico"; exit 1; }
            N=$(pdfinfo "$p.pdf" | awk '/^Pages/{print $2}')
            # e um PDF de uma página também é "não vazio": o test -s sozinho deixava passar um
            # documento truncado. O piso é por paper, e é folgado — mede o desastre, não o estilo.
            case "$p" in teoria) MIN=25 ;; catalogo) MIN=80 ;; enredo) MIN=400 ;; esac
            [ "${N:-0}" -ge "$MIN" ] \
              || { echo "❌ $p.pdf tem $N páginas, e o mínimo é $MIN — não publico"; exit 1; }
            echo "✅ $p.pdf ($N páginas)"
          done

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host server" >> ~/.ssh/config
          echo "  HostName ${{ vars.SSH_HOST }}" >> ~/.ssh/config
          echo "  User ${{ vars.SSH_USER }}" >> ~/.ssh/config
          echo "  ConnectTimeout 30" >> ~/.ssh/config
          # AddressFamily inet: o runner resolve o host em IPv6 e não tem rota para lá —
          # "Network is unreachable" antes sequer de haver ligação. Forçar IPv4 é a cura,
          # e não muda nada onde o IPv6 funciona.
          echo "  AddressFamily inet" >> ~/.ssh/config
          echo "  ServerAliveInterval 15" >> ~/.ssh/config
          for i in 1 2 3; do
            ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done

      - name: Espelhar no fork da Patria
        run: |
          # RETENTATIVAS, e não por gosto: este passo caiu CINCO vezes com
          #   ssh: connect to host ... port 22: Connection timed out
          # sempre depois de o portão ter compilado os três papers, e sempre a passar na
          # corrida seguinte sem se tocar em nada. É o servidor a não atender, não o código —
          # e o custo de perder a corrida é recompilar 480 páginas para nada.
          #
          # Três tentativas com espera crescente. Se as três falharem, o passo FALHA: isto
          # torna a rede intermitente sobrevivível, não esconde um servidor em baixo.
          tenta() {
            for n in 1 2 3; do
              "$@" && return 0
              echo "   tentativa $n falhou; nova em $((n*20))s" >&2
              sleep $((n*20))
            done
            return 1
          }
          tenta git push --mirror server:/root/tiffany-repo.git
          # e o que o front serve, atualizado a partir do bare — sem commit-graph, que o
          # nginx gzip-a e faz o git cuspir "inflate: data stream error" no clone.
          # o script remoto vai a FICHEIRO, e não por um heredoc ligado ao `tenta`: um
          # heredoc é lido UMA vez, portanto a segunda tentativa mandaria stdin vazio — um
          # ssh que "corre bem" e não executa nada. Do ficheiro, cada tentativa reabre.
          cat > /tmp/espelha.sh <<'REMOTO'
            set -e
            D=/var/www/goldenkingdom/repo.git
            [ -d "$D" ] || git clone -q --bare /root/tiffany-repo.git "$D"
            git --git-dir="$D" fetch -q /root/tiffany-repo.git '+refs/*:refs/*'
            git --git-dir="$D" update-server-info
            rm -rf "$D/objects/info/commit-graph" "$D/objects/info/commit-graphs"
            chmod -R a+rX "$D"
            echo "fork: $(git --git-dir=$D rev-list --count HEAD) commits"
          REMOTO
          for n in 1 2 3; do
            ssh server bash -s < /tmp/espelha.sh && break
            [ "$n" = 3 ] && { echo "❌ o espelho não subiu em 3 tentativas"; exit 1; }
            echo "   tentativa $n falhou; nova em $((n*20))s" >&2
            sleep $((n*20))
          done

      - name: Publicar os PDFs (sem passar pelo chess)
        run: |
          # O dispatch para o chess foi retirado, e por bem: ele exigia um PAT só para pedir
          # ao outro repo que reconstruísse o site inteiro — quando o que muda aqui são os
          # papers que este workflow já compilou. Menos uma credencial, menos um salto, e
          # o site deixa de ser reconstruído por causa de uma vírgula num .tex.
          # o mesmo retry do passo anterior: a ligação é a mesma e cai da mesma maneira.
          tenta() {
            for n in 1 2 3; do
              "$@" && return 0
              echo "   tentativa $n falhou; nova em $((n*20))s" >&2
              sleep $((n*20))
            done
            return 1
          }
          tenta scp teoria.pdf catalogo.pdf enredo.pdf server:/var/www/goldenkingdom/docs/
          tenta ssh server "chmod a+r /var/www/goldenkingdom/docs/*.pdf"
          for d in teoria catalogo enredo; do
            C=$(curl -sf -o /dev/null -w '%{http_code}' \
                 "https://goldenkingdom.patriatechnology.com/docs/$d.pdf" || echo FAIL)
            T=$(curl -sf -o /dev/null -w '%{content_type}' \
                 "https://goldenkingdom.patriatechnology.com/docs/$d.pdf" || echo '?')
            # o content-type importa: o SPA fallback devolve 200 com text/html para um ficheiro
            # que não existe, e um health check que só olhasse o código passaria em falso.
            [ "$C" = "200" ] && [ "$T" = "application/pdf" ] \
              || { echo "❌ /docs/$d.pdf -> $C ($T)"; exit 1; }
            echo "✅ /docs/$d.pdf no ar"
          done
