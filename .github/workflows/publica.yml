name: Publicar na Patria

# ─────────────────────────────────────────────────────────────────────────────
#  UM repositório, UM workflow. Desde 03/08 o tiffany é auto-contido: tem os
#  documentos, o app e as figuras. O chess saiu da jogada.
#
#  Antes eram dois repos a servir o mesmo site, e a dependência era CRUZADA: o
#  chess clonava o fork do tiffany por HTTP para compilar a teoria e o catálogo,
#  e o tiffany fazia scp dos PDFs por cima do que o chess publicava. Cada lado
#  sabia metade, e o rsync --delete de um apagava o que o outro tinha posto.
#  Agora há um dono só de cada coisa.
#
#  O que este workflow faz, por ordem:
#    1. sobe o tradutor .tex→PDF para wasm (tools/sobe_tex_wasm.sh) — a composição
#       é NO BROWSER, não no servidor (sem TeX Live a servir /docs/*.pdf da teoria);
#    2. compila o CV (curriculo/cv.tex) → /docs/cv.pdf — estático; não entra no
#       corpo do tradutor WASM;
#    3. constrói o app (Vite): dist/wasm/tex.wasm + dist/corpo/ + cv.pdf;
#    4. espelha o repo no fork que a Patria serve para clone público;
#    5. manda o artefato ao servidor por scp, e ele troca o diretório.
#
#  Os .tex partilham um preâmbulo — estilo.tex — e cada um é um `subfiles`:
#  continua a compilar sozinho (`pdflatex teoria.tex`) e também entra no
#  livro.tex. NÃO se pode mover o corpo para outro ficheiro: a bateria.sh monta
#  a lista de medidores por grep em teoria.tex/catalogo.tex/enredo.tex, e
#  renomeá-los tira medidores da corrida em silêncio.
#
#  Os PDFs da teoria/papers NÃO sobem no artefato: o cliente compõe com tex.wasm.
#  O CV ainda passa por pdflatex (não está no corpo WASM). As figuras rasterizadas
#  na GPU não se reproduzem sem placa NVIDIA.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: PROD
    # TeX Live COMPLETO num container, em vez de caçar pacotes um a um. A lista
    # nunca fecha: cada documento novo pede outro (fvextra, tcolorbox, truncate,
    # skak, cm-super...). A imagem oficial já os tem todos, e foi assim que o
    # deploy do outro repo resolveu o mesmo problema — herda-se a decisão.
    container:
      image: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # o espelho quer a história toda

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ferramentas do container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3 openssh-client rsync curl unzip jq git sudo poppler-utils \
            gcc libc6-dev
          # (o node vem do setup-node acima, não do apt: o do Debian é mais velho)
          # gcc: tools/traduz.c → tex.wasm (o tradutor no cliente)

          # E o git tem de aceitar o checkout: o container corre como root e a
          # árvore que o actions/checkout deixou é de outro UID, portanto o git
          # recusa-a com "detected dubious ownership" — e recusa-a de forma
          # DETERMINÍSTICA, o que o retry do espelho mascarou (três tentativas
          # do mesmo erro, sessenta segundos de espera, e a mensagem só visível
          # no log completo).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'

      - name: O tradutor sobe para wasm?
        run: |
          # A composição no ar É o módulo no browser — não pdflatex a gravar /docs/.
          bash tools/sobe_tex_wasm.sh
          test -s assets/figuras/wasm/tex.wasm \
            || { echo "❌ tex.wasm não saiu — não publico"; exit 1; }
          BYTES=$(wc -c < assets/figuras/wasm/tex.wasm | tr -d ' ')
          echo "✅ tex.wasm ($BYTES bytes) — tecto 256 MB (4096 páginas)"

      - name: O CV compila? (estático — único PDF pré-gravado do site)
        run: |
          # O CV vive em curriculo/ e sobe para /docs/cv.pdf. Não entra no corpo
          # WASM; o resto dos docs compõe-se no cliente.
          cd curriculo
          for i in 1 2 3; do
            pdflatex -interaction=nonstopmode cv.tex >/dev/null 2>&1 || true
          done
          test -s cv.pdf || { echo "❌ curriculo/cv.pdf não compilou — não publico"; exit 1; }
          N=$(pdfinfo cv.pdf | awk '/^Pages/{print $2}')
          [ "${N:-0}" -ge 5 ] \
            || { echo "❌ cv.pdf tem $N páginas, e o mínimo é 5 — não publico"; exit 1; }
          echo "✅ cv.pdf ($N páginas) — vai para /docs/cv.pdf, ligado em «O autor»"
          cd ..

      - name: Construir o app
        run: |
          cd app
          npm ci
          npx vite build
          # só o CV fica pré-composto; teoria/papers saem de tex.wasm + /corpo/
          mkdir -p dist/docs
          cp ../curriculo/cv.pdf dist/docs/cv.pdf

      - name: O build tem o tradutor, o corpo e o CV?
        run: |
          cd app
          test -s dist/wasm/tex.wasm || { echo "❌ falta dist/wasm/tex.wasm"; exit 1; }
          test -s dist/docs/cv.pdf || { echo "❌ falta dist/docs/cv.pdf"; exit 1; }
          # o corpo: a lista medida — sem ela o cliente não abre fontes/estilo
          for f in estilo.tex teoria.tex papers/corpo_computacional.tex lib/fontes/documento-regular.otf; do
            test -s "dist/corpo/$f" || { echo "❌ falta dist/corpo/$f"; exit 1; }
          done
          N=$(find dist/corpo -type f | wc -l | tr -d ' ')
          echo "✅ corpo: $N ficheiros; wasm: $(wc -c < dist/wasm/tex.wasm | tr -d ' ') bytes"
          test -s dist/index.html || { echo "❌ o Vite não produziu index.html"; exit 1; }
          JS=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          test -n "$JS" && test -s "dist/$JS" \
            || { echo "❌ o index.html não aponta para um bundle existente"; exit 1; }
          echo "✅ o build serve: $JS + tex.wasm + corpo + cv.pdf"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for i in 1 2 3; do
            ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done

      - name: Espelhar no fork da Patria
        run: |
          # Sem alias `server` e sem ~/.ssh/config: este job corre DENTRO de um
          # container e o ssh não apanhou o config lá — deu três "Could not
          # resolve hostname server" e o passo ainda assim devolveu 0, e o site
          # ficou dois dias com o build antigo. Host direto, e falha a sério.
          set -e
          HOST="${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}"
          SSHOPT="-i $HOME/.ssh/id_rsa -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"
          export GIT_SSH_COMMAND="ssh $SSHOPT"
          # RETENTATIVAS, e não por gosto: este passo caiu muitas vezes com
          # "connect to host ... port 22: Connection timed out", sempre depois de
          # o portão ter compilado tudo, e sempre a passar na corrida seguinte
          # sem se tocar em nada. É o servidor a não atender, não o código.
          ok=0
          for n in 1 2 3; do
            git push --mirror "$HOST:/root/tiffany-repo.git" && { ok=1; break; }
            echo "   tentativa $n falhou; nova em $((n*20))s" >&2
            sleep $((n*20))
          done
          [ "$ok" = 1 ] || { echo "❌ o espelho não subiu em 3 tentativas"; exit 1; }

          # e o que o front serve para clone, atualizado a partir do bare — sem
          # commit-graph, que o nginx gzip-a e faz o git cuspir "inflate: data
          # stream error" no clone. O script vai a FICHEIRO e não por heredoc:
          # um heredoc é lido UMA vez, e a segunda tentativa mandaria stdin
          # vazio — um ssh que "corre bem" e não executa nada.
          cat > /tmp/espelha.sh <<'REMOTO'
            set -e
            D=/var/www/goldenkingdom/repo.git
            [ -d "$D" ] || git clone -q --bare /root/tiffany-repo.git "$D"
            git --git-dir="$D" fetch -q /root/tiffany-repo.git '+refs/*:refs/*'
            git --git-dir="$D" update-server-info
            rm -rf "$D/objects/info/commit-graph" "$D/objects/info/commit-graphs"
            chmod -R a+rX "$D"
            echo "fork: $(git --git-dir=$D rev-list --count HEAD) commits"
          REMOTO
          ok=0
          for n in 1 2 3; do
            ssh $SSHOPT "$HOST" bash -s < /tmp/espelha.sh && { ok=1; break; }
            echo "   tentativa $n falhou; nova em $((n*20))s" >&2
            sleep $((n*20))
          done
          [ "$ok" = 1 ] || { echo "❌ o fork não atualizou em 3 tentativas"; exit 1; }

      - name: Publicar no servidor
        run: |
          # SEM R2. O artefato vai por scp, direto.
          #
          # O R2 (upload + presigned URL + o servidor a descarregar) veio dos
          # moldes dos outros apps da Patria, e chegou aqui com a consolidação.
          # Mas os secrets R2_* nunca existiram neste repositório: viviam no
          # outro, e o passo corria com as chaves VAZIAS — `aws configure set
          # aws_access_key_id` sem argumento, e o endpoint a ficar em
          # `https://.r2.cloudflarestorage.com`.
          #
          # E não vale a pena configurá-los: este repositório já publicava os
          # PDFs por scp, com sucesso, há semanas. Três saltos (subir ao R2,
          # assinar um URL, o servidor descarregar) fazem o que um faz —
          # e cada um deles é mais uma coisa que pode cair.
          set -e
          HOST="${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}"
          SSHOPT="-i $HOME/.ssh/id_rsa -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"
          tar -czf /tmp/gk-deploy.tar.gz -C app/dist .
          echo "artefato: $(du -h /tmp/gk-deploy.tar.gz | cut -f1)"

          cat > /tmp/deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          DEPLOY_DIR="${1:-/var/www/goldenkingdom}"
          # o repo.git servido por dumb HTTP vive DENTRO do DEPLOY_DIR e não vem
          # no artefato: extrai-se para um diretório novo e troca-se, preservando-o.
          # Um rsync --delete cego apagava o fork, e o clone público morria sem
          # ninguém dar por isso.
          rm -rf /tmp/gk-novo && mkdir -p /tmp/gk-novo
          tar -xzf /tmp/gk-deploy.tar.gz -C /tmp/gk-novo
          rm -f /tmp/gk-deploy.tar.gz
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete --exclude 'repo.git' /tmp/gk-novo/ "$DEPLOY_DIR/"
          rm -rf /tmp/gk-novo
          chmod -R a+rX "$DEPLOY_DIR"

          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://goldenkingdom.patriatechnology.com/ || echo FAIL)
          [ "$STATUS" = "200" ] || { echo "❌ health check: $STATUS"; exit 1; }
          # o tradutor no cliente: módulo + um pedaço do corpo (não /docs/*.pdf da teoria)
          for u in wasm/tex.wasm corpo/estilo.tex corpo/papers/corpo_computacional.tex \
                   corpo/conecthus/pipeline.tex wasm/claim.wasm; do
            C=$(curl -sf -o /dev/null -w '%{http_code}' "https://goldenkingdom.patriatechnology.com/$u" || echo FAIL)
            [ "$C" = "200" ] || { echo "❌ /$u -> $C"; exit 1; }
          done
          # CV ainda é PDF estático
          C=$(curl -sf -o /dev/null -w '%{http_code}' "https://goldenkingdom.patriatechnology.com/docs/cv.pdf" || echo FAIL)
          T=$(curl -sf -o /dev/null -w '%{content_type}' "https://goldenkingdom.patriatechnology.com/docs/cv.pdf" || echo '?')
          [ "$C" = "200" ] && [ "$T" = "application/pdf" ] \
            || { echo "❌ /docs/cv.pdf -> $C ($T)"; exit 1; }
          echo "✅ no ar (HTTP $STATUS, tex.wasm + corpo + cv.pdf)"
          SCRIPT

          ok=0
          for n in 1 2 3; do
            if scp $SSHOPT /tmp/gk-deploy.tar.gz /tmp/deploy.sh "$HOST:/tmp/" && \
               ssh $SSHOPT "$HOST" "chmod +x /tmp/deploy.sh && bash /tmp/deploy.sh '${{ vars.DEPLOY_DIR }}' && rm -f /tmp/deploy.sh"; then
              ok=1; break
            fi
            echo "   tentativa $n falhou; nova em 15s" >&2
            sleep 15
          done
          # o `for` TEM de falhar o passo se as três caírem. Sem isto o workflow
          # dizia success com o site intacto — aconteceu duas vezes, e passaram
          # dois dias antes de alguém reparar.
          [ "$ok" = 1 ] || { echo "❌ o deploy não chegou ao servidor em 3 tentativas — o site NÃO foi atualizado"; exit 1; }
