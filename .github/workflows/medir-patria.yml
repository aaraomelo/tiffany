# ─────────────────────────────────────────────────────────────────────────────
#  medir-patria.yml — MEDIR NO METAL, na própria máquina, sem chave nenhuma.
#
#  POR QUE EXISTE. O `banco/sql.c` é POSIX puro: assume `pread`/`pwrite`,
#  sockets BSD e multicast. Num portátil Windows ele não compila, e o que se
#  arranja com stubs mede o stub — três unidades do `sql teste` falhavam lá por
#  causa do ambiente, e duas delas eram exactamente as do CANAL. Medir o motor
#  num sítio onde o canal não funciona é dizer que não se mediu.
#
#  E A MÁQUINA JÁ CÁ ESTÁ. O runner `patria` corre no próprio servidor, com um
#  utilizador sem privilégios (docs/RUNNER.md). Não há `Setup SSH`, não há chave
#  privada a viajar, não há `scp`: compila-se onde a máquina é, e a medição é
#  local. É o mesmo argumento do `publica-local.yml`, aplicado à bateria.
#
#  O QUE ISTO NÃO TOCA. Nada fora do workspace do runner e do `/tmp`. Não há
#  `sudo`, não se escreve na publicação, não se mexe em container nenhum e não
#  se lê base de dados de cliente. O `sql teste` cria e apaga `/tmp/sql_teste.*`,
#  e o passo final limpa-o mesmo quando algo falha.
#
#  O CANAL, e é o ponto. Acima de `S_CANAL` o LOAD/STORE do motor deixa de ir ao
#  disco e vai à banda — datagrama UDP no grupo 239.7.31.27:47313, preso ao
#  loopback. É um backend de memória, não um protocolo à parte, e é por isso que
#  só se mede onde ele existe. Aqui existe.
#
#  SEGURANÇA. O gatilho é SÓ `workflow_dispatch` — exige escrita no repositório,
#  e o repo é privado desde 2026-08-20. Se algum dia se acrescentar um gatilho
#  `pull_request` a QUALQUER workflow deste repo, esta análise cai e o runner
#  tem de sair; é a mesma nota que o `publica-local.yml` carrega, e vale igual.
# ─────────────────────────────────────────────────────────────────────────────
name: Medir na Patria (runner local)

on:
  workflow_dispatch:
    inputs:
      medidor:
        description: 'Um medidor de tests/ (sem extensão, ex.: simbolos). Vazio = nenhum.'
        required: false
        type: string
        default: ''

jobs:
  medir:
    runs-on: [self-hosted, patria]
    timeout-minutes: 30

    steps:
      - name: Buscar o código
        uses: actions/checkout@v4

      - name: As ferramentas estão cá?
        run: |
          falta=0
          for b in cc; do
            command -v "$b" >/dev/null 2>&1 || { echo "❌ falta: $b"; falta=1; }
          done
          [ "$falta" = "0" ] || { echo "instale o que falta — ver docs/RUNNER.md"; exit 1; }
          echo "✅ cc: $(cc --version | head -1)"
          echo "   uname: $(uname -srm)"

      # ── O MOTOR, COMPILADO NO METAL ────────────────────────────────────────
      # Sem stub, sem -D de contorno, sem shim: é a linha do cabeçalho do sql.c.
      - name: Compilar o motor
        run: |
          set -e
          cc -O2 -std=c99 -w -Ilib -Ibanco -o /tmp/sqlb banco/sql.c -lm
          echo "✅ banco/sql.c compilou nativo — $(stat -c%s /tmp/sqlb) bytes"

      # ── A BATERIA DO PRÓPRIO MOTOR ─────────────────────────────────────────
      # 98 unidades. No Windows falhavam três; aqui exige-se ZERO, e as duas do
      # canal são nomeadas à parte porque são a razão de este workflow existir.
      - name: O sql teste, e as unidades uma a uma
        run: |
          set -o pipefail
          rm -f /tmp/sql_teste.*
          /tmp/sqlb teste > /tmp/sql_teste.out 2>&1 || true
          ok=$(grep -ac '^#UNIT ok'    /tmp/sql_teste.out || true); ok=${ok:-0}
          ma=$(grep -ac '^#UNIT falha' /tmp/sql_teste.out || true); ma=${ma:-0}
          echo "── unidades: $ok ok, $ma falha(s) ──"
          if [ "$ma" -gt 0 ]; then
            echo "── as que falharam ──"
            grep -a '^#UNIT falha' /tmp/sql_teste.out
          fi
          echo
          echo "── O CANAL COMO BACKEND (é isto que só se pode medir cá) ──"
          grep -a -E '#UNIT (ok|falha) +(o Word atravessou a banda|e o slot e o endereco)' \
            /tmp/sql_teste.out || echo "  ⚠ as asserções do canal não apareceram na saída"
          echo
          [ "$ma" = "0" ] || { echo "❌ $ma unidade(s) vermelha(s)"; exit 1; }
          echo "✅ as $ok unidades do motor, verdes"

      # ── O CANAL, VISTO DO OUTRO LADO ───────────────────────────────────────
      # O `sql teste` mede-o como BACKEND do motor; o tests/canal.c mede a banda
      # e a antena em si — §N1..§N4. São as duas metades da mesma coisa.
      - name: A banda e a antena (tests/canal.c)
        run: |
          set -e
          cc -O2 -std=c99 -w -Ilib -Itests -o /tmp/canal tests/canal.c -lm
          /tmp/canal
          echo "✅ o canal mediu-se dos dois lados"

      # ── OS SEIS SINAIS, CONTRA UM ORÁCULO INDEPENDENTE ─────────────────────
      # A resposta do motor comparada com a conta feita fora dele. Se o motor e
      # o oráculo discordarem, é o motor que está errado — o oráculo não tem
      # bytecode, não tem poda e não tem marca de coluna.
      - name: Os seis sinais, contra o oráculo
        run: |
          set -e
          B=$(mktemp -d); cd "$B"
          /tmp/sqlb t "CREATE TABLE t (a,c)" > /dev/null
          VALS="1 5 10 20 33 50"
          for v in $VALS; do /tmp/sqlb t "INSERT INTO t VALUES ($v,$((v*2)))" > /dev/null; done
          tot=0; mau=0
          for op in "=" "<>" "<" ">" "<=" ">="; do
            for k in 0 1 20 33 50 100; do
              for neg in 0 1; do
                if [ "$neg" = 1 ]; then w="NOT (a $op $k)"; else w="a $op $k"; fi
                esp=""
                for v in $VALS; do
                  case "$op" in
                    "=")  t=$([ "$v" -eq "$k" ] && echo 1 || echo 0) ;;
                    "<>") t=$([ "$v" -ne "$k" ] && echo 1 || echo 0) ;;
                    "<")  t=$([ "$v" -lt "$k" ] && echo 1 || echo 0) ;;
                    ">")  t=$([ "$v" -gt "$k" ] && echo 1 || echo 0) ;;
                    "<=") t=$([ "$v" -le "$k" ] && echo 1 || echo 0) ;;
                    ">=") t=$([ "$v" -ge "$k" ] && echo 1 || echo 0) ;;
                  esac
                  [ "$neg" = 1 ] && t=$((1-t))
                  [ "$t" = 1 ] && esp="$esp$v|$((v*2)) "
                done
                got=$(/tmp/sqlb t "SELECT * FROM t WHERE $w" 2>&1 \
                      | grep -E '^ +[0-9-]+ \|' | tr -d ' ' | tr '\n' ' ' || true)
                tot=$((tot+1))
                if [ "$(echo $got)" != "$(echo $esp)" ]; then
                  mau=$((mau+1))
                  printf 'ERRADO  %-20s esperado=[%s] obtido=[%s]\n' "$w" "$(echo $esp)" "$(echo $got)"
                fi
              done
            done
          done
          cd /; rm -rf "$B"
          echo "── $tot consultas contra o oráculo, $mau erradas ──"
          [ "$mau" = "0" ] || { echo "❌ o motor discorda do oráculo"; exit 1; }
          echo "✅ os seis sinais respondem o que a conta diz"

      # ── UM MEDIDOR À ESCOLHA ───────────────────────────────────────────────
      - name: O medidor pedido
        if: ${{ inputs.medidor != '' }}
        run: |
          set -e
          f="tests/${{ inputs.medidor }}.c"
          [ -f "$f" ] || { echo "não há $f neste ref"; exit 1; }
          cc -O2 -std=c99 -w -Ilib -Itests -Itools -o /tmp/med "$f" -lm
          /tmp/med
          echo "✅ $f"

      - name: Limpar o que se escreveu
        if: always()
        run: rm -f /tmp/sql_teste.* /tmp/sqlb /tmp/canal /tmp/med
