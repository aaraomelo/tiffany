name: Publicar o Conecthus (tiffany-api e tiffany-app)

# ─────────────────────────────────────────────────────────────────────────────
#  Os dois vieram de Patria-Labs (patria-api e landpage, hoje tiffany-api e
#  tiffany-app), e esses repositórios foram APAGADOS.
#  Com eles morreram os workflows que os punham no ar — e os dois estão em
#  produção, seis containers entre prod, homolog e dev. Este ficheiro é o que
#  ficou no lugar deles, e é mais curto que os originais por uma razão só:
#
#  SEM R2. O original construía o artefato, subia-o ao Cloudflare R2, assinava
#  um URL e mandava o servidor descarregá-lo. Três saltos a fazer o que um faz —
#  e os segredos R2_* viviam SÓ naqueles repositórios, ilegíveis por API, logo
#  desapareceram com eles. Aqui o artefato vai por scp, que é a mesma travessia
#  que o publica.yml deste repositório já fazia, com a chave que já temos.
#
#  E O QUE NÃO ATRAVESSA: o DATABASE_URL das migrations. Ele fica em
#  /root/plataforma/conecthus/deploy-vars.txt no servidor (chmod 600), copiado
#  das environment variables dos repos antes de os apagar. O script remoto
#  procura-o lá; o workflow nunca o vê. É o mesmo princípio dos /root/.erp_* .
#
#  GATILHO, igual ao do erp.yml e pela mesma razão: o master é o tronco de
#  trabalho diário, e um commit distraído não pode chegar a produção. Push com
#  `paths:` publica em HOMOLOGAÇÃO; produção e dev são workflow_dispatch.

on:
  push:
    branches: [master]
    paths:
      - 'plataforma/conecthus/**'
      - '.github/workflows/conecthus.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Qual dos dois'
        type: choice
        options: [patria-api, landpage, ambos]
        default: ambos
      ambiente:
        description: 'Onde publicar'
        type: choice
        options: [homolog, dev, producao]
        default: homolog

jobs:
  publicar:
    runs-on: ubuntu-latest
    # o postgres é para a VALIDAÇÃO, não para o deploy: o tiffany-api corre aqui as suas
    # migrations contra uma base descartável antes de tocar no servidor. O tiffany-app
    # ignora-o — `services` declara-se no job, não no passo, e um postgres a mais não custa.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: validacao
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false          # a landpage não deve ficar por publicar porque a api falhou
      matrix:
        app: [tiffany-api, tiffany-app]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2        # o `git diff HEAD~1` decide se há migrations a correr

      - name: Este app entra nesta corrida?
        id: quero
        run: |
          ESCOLHIDO="${{ github.event.inputs.app || 'ambos' }}"
          if [ "$ESCOLHIDO" = "ambos" ] || [ "$ESCOLHIDO" = "${{ matrix.app }}" ]; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          else
            echo "sim=0" >> "$GITHUB_OUTPUT"; echo "→ ${{ matrix.app }} fica de fora desta corrida"
          fi

      - name: Qual ambiente
        id: alvo
        if: steps.quero.outputs.sim == '1'
        run: |
          AMB="${{ github.event.inputs.ambiente || 'homolog' }}"
          APP="${{ matrix.app }}"
          # os nomes e portas vieram das environment variables dos repos apagados;
          # não são segredo — são caminhos e nomes de container.
          # DUAS RÉGUAS, e é deliberado: à esquerda o nome DAQUI (a pasta), à direita o
          # nome NO SERVIDOR (container e directório), que continua a ser o antigo. Renomear
          # containers vivos é outra operação. Por isso o nome do servidor entra sempre
          # explícito nesta tabela e nunca se deriva do nome da pasta.
          case "$APP-$AMB" in
            tiffany-api-producao) D=/root/patria-api;          C=patria-api;          P=8080; F=/root/docker-compose.prod.yml ;;
            tiffany-api-homolog)  D=/root/patria-api-homolog;  C=patria-api-homolog;  P=8081; F=/root/docker-compose.homolog.yml ;;
            tiffany-api-dev)      D=/root/patria-api-dev;      C=patria-api-dev;      P=8082; F=/root/docker-compose.dev.yml ;;
            tiffany-app-producao) D=/root/landpage;            C=landpage;            P=3000; F=/root/docker-compose.prod.yml ;;
            tiffany-app-homolog)  D=/root/landpage-homolog;    C=landpage-homolog;    P=3001; F=/root/docker-compose.homolog.yml ;;
            tiffany-app-dev)      D=/root/landpage-dev;        C=landpage-dev;        P=3002; F=/root/docker-compose.dev.yml ;;
            *) echo "combinação desconhecida: $APP-$AMB"; exit 1 ;;
          esac
          { echo "dir=$D"; echo "container=$C"; echo "porta=$P"; echo "compose=$F"; echo "ambiente=$AMB"; } >> "$GITHUB_OUTPUT"
          # a api responde /api/health; a landpage serve a raiz
          [ "$APP" = "tiffany-api" ] && echo "saude=/api/health" >> "$GITHUB_OUTPUT" || echo "saude=/" >> "$GITHUB_OUTPUT"
          echo "→ $APP em $AMB: $C na porta $P"

      - uses: actions/setup-node@v4
        if: steps.quero.outputs.sim == '1'
        with:
          node-version: 20

      - name: Construir
        if: steps.quero.outputs.sim == '1'
        working-directory: plataforma/conecthus/${{ matrix.app }}
        run: |
          npm ci
          npm run build

      - name: Validação antes de publicar
        if: steps.quero.outputs.sim == '1'
        working-directory: plataforma/conecthus/${{ matrix.app }}
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/validacao
          API_KEY_PATRICIA: validacao
          API_KEY_WORKER: validacao
          API_KEY_ADMIN: validacao
          PORT: '8080'
          ENABLE_WORKER: 'false'
        run: |
          # Isto veio dos deploy.yml originais e é a metade que impede um deploy de partir
          # produção: a app SOBE aqui, contra uma base descartável, e só se responder 200 é
          # que o artefato viaja. As chaves são de mentira — só têm de existir para o
          # arranque; o que se mede é se ele arranca, não o que ele faz.
          if [ "${{ matrix.app }}" = "tiffany-api" ]; then
            npx prisma migrate deploy 2>&1 | tail -5
            mkdir -p public
            node dist/main.js > /tmp/validacao.log 2>&1 &
            PID=$!
            # `localhost` e não 127.0.0.1: MEDIDO aqui — o vite preview liga-se só a ::1, e
            # o mesmo pode valer para outros. localhost resolve para o que existir.
            # E o código sai limpo: `curl -w` já imprime 000 ao falhar, portanto um
            # `|| echo 000` colado dava "000000" e nunca igualava "200".
            S=000
            for i in $(seq 1 15); do
              S=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/api/health 2>/dev/null) || S=000
              [ "$S" = "200" ] && break
              sleep 2
            done
            kill $PID 2>/dev/null || true
            [ "$S" = "200" ] || { echo "a app não subiu (HTTP $S). O que ela disse:"; cat /tmp/validacao.log; exit 1; }
            echo "arranca e responde 200"
          else
            npx vite preview --port 4173 > /tmp/validacao.log 2>&1 &
            PID=$!
            S=000
            for i in $(seq 1 10); do
              S=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:4173/ 2>/dev/null) || S=000
              [ "$S" = "200" ] && break
              sleep 2
            done
            kill $PID 2>/dev/null || true
            [ "$S" = "200" ] || { echo "o build não serve (HTTP $S):"; cat /tmp/validacao.log; exit 1; }
            echo "o build serve 200"
          fi

      - name: Artefato
        if: steps.quero.outputs.sim == '1'
        working-directory: plataforma/conecthus/${{ matrix.app }}
        run: |
          # cada um leva o que o seu Dockerfile precisa, e nada mais
          if [ "${{ matrix.app }}" = "tiffany-api" ]; then
            tar -czf /tmp/artefato.tar.gz dist prisma package.json package-lock.json Dockerfile .dockerignore PRODUCT.md
          else
            tar -czf /tmp/artefato.tar.gz dist Dockerfile nginx-container.conf
          fi
          echo "artefato: $(du -h /tmp/artefato.tar.gz | cut -f1)"

      - name: O schema mudou? (só então há migrations)
        id: schema
        if: steps.quero.outputs.sim == '1'
        run: |
          N=$(git diff --name-only HEAD~1 HEAD -- plataforma/conecthus/${{ matrix.app }}/prisma/ | wc -l)
          echo "mudou=$N" >> "$GITHUB_OUTPUT"
          echo "ficheiros de schema tocados: $N"

      - name: Setup SSH
        if: steps.quero.outputs.sim == '1'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          {
            echo "Host server"
            echo "  HostName ${{ vars.SSH_HOST }}"
            echo "  User ${{ vars.SSH_USER }}"
            echo "  AddressFamily inet"
            echo "  ConnectTimeout 30"
            echo "  ServerAliveInterval 15"
          } >> ~/.ssh/config
          for i in 1 2 3; do ssh-keyscan -4 -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done

      - name: Publicar
        if: steps.quero.outputs.sim == '1'
        run: |
          scp /tmp/artefato.tar.gz server:/tmp/conecthus-artefato.tar.gz
          scp plataforma/conecthus/deploy.sh server:/tmp/conecthus-deploy.sh
          ssh server "chmod +x /tmp/conecthus-deploy.sh && /tmp/conecthus-deploy.sh \
            '${{ steps.alvo.outputs.dir }}' \
            '${{ steps.alvo.outputs.compose }}' \
            '${{ steps.alvo.outputs.container }}' \
            '${{ steps.alvo.outputs.porta }}' \
            '${{ steps.schema.outputs.mudou }}' \
            '${{ matrix.app }}' \
            '${{ steps.alvo.outputs.ambiente }}' \
            '${{ steps.alvo.outputs.saude }}' && rm -f /tmp/conecthus-deploy.sh"

      - name: Contar a falha à API
        if: failure() && steps.quero.outputs.sim == '1'
        run: |
          # Os originais faziam isto e vale a pena manter: a API tem um webhook que recebe o
          # diagnóstico do deploy que falhou. `|| true` de propósito — um deploy falhado não
          # pode falhar DUAS vezes por causa do aviso.
          case "${{ steps.alvo.outputs.ambiente }}" in
            producao) H=patria.patriatechnology.com ;;
            homolog)  H=patria.homolog.patriatechnology.com ;;
            *)        H=patria.dev.patriatechnology.com ;;
          esac
          DIAG=$(tail -50 /tmp/validacao.log 2>/dev/null || echo 'falhou antes da validação')
          jq -n --arg sha "${{ github.sha }}" --arg app "${{ matrix.app }}" --arg diag "$DIAG" \
             '{commitSha: $sha, app: $app, diagnostic: $diag}' \
          | curl -sf -X POST "https://$H/api/webhooks/deploy-diagnostic" \
              -H 'Content-Type: application/json' -d @- || true
