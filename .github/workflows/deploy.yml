name: Deploy Patria API

on:
  push:
    branches: [main, homolog, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'PROD' || github.ref_name == 'homolog' && 'HOMOLOG' || 'DEV' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create deploy artifact
        id: artifact
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          ENV_NAME="${{ github.ref_name }}"
          FILE_NAME=patria-api-${ENV_NAME}-${TIMESTAMP}.tar.gz
          tar -czf $FILE_NAME dist prisma package.json package-lock.json Dockerfile .dockerignore PRODUCT.md
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Install AWS CLI
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Upload to R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto
          aws s3 cp ${{ steps.artifact.outputs.FILE_NAME }} \
            s3://patria-deploys/${{ steps.artifact.outputs.FILE_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Generate presigned URL
        id: presign
        run: |
          URL=$(aws s3 presign s3://patria-deploys/${{ steps.artifact.outputs.FILE_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --expires-in 1800)
          echo "DOWNLOAD_URL=$URL" >> $GITHUB_OUTPUT

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for i in 1 2 3; do
            ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done

      - name: Download artifact on server
        run: |
          echo '${{ steps.presign.outputs.DOWNLOAD_URL }}' > /tmp/download_url.txt
          scp /tmp/download_url.txt ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/tmp/download_url.txt
          ssh ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "
            set -e
            URL=\$(cat /tmp/download_url.txt)
            curl -sfL \"\$URL\" -o /tmp/patria-api-deploy.tar.gz
            rm -f /tmp/download_url.txt
            echo '✅ Downloaded'
          "

      - name: Extract and deploy
        run: |
          ssh ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "
            set -e
            DEPLOY_DIR=${{ vars.DEPLOY_DIR }}
            mkdir -p \$DEPLOY_DIR
            tar -xzf /tmp/patria-api-deploy.tar.gz -C \$DEPLOY_DIR
            rm -f /tmp/patria-api-deploy.tar.gz
            cd \$DEPLOY_DIR && mkdir -p public
            docker compose -f ${{ vars.COMPOSE_FILE }} build ${{ vars.CONTAINER_NAME }}
            docker compose -f ${{ vars.COMPOSE_FILE }} up -d --force-recreate ${{ vars.CONTAINER_NAME }}
          "

      - name: Check for schema changes
        id: schema
        run: |
          COUNT=$(git diff --name-only HEAD~1 HEAD -- prisma/ | wc -l)
          echo "changed=$COUNT" >> $GITHUB_OUTPUT

      - name: Run migrations
        if: steps.schema.outputs.changed != '0'
        run: |
          ssh ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "\
            cd ${{ vars.DEPLOY_DIR }} && \
            npm install prisma@5.22.0 --no-save 2>/dev/null && \
            DATABASE_URL=${{ vars.DATABASE_URL }} npx prisma migrate deploy"

      - name: Sync worker Prisma client
        if: steps.schema.outputs.changed != '0'
        run: |
          WORKER_DIR=$(echo "${{ vars.DEPLOY_DIR }}" | sed 's/patria-api/patria-worker/')
          WORKER_SVC=$(echo "${{ vars.CONTAINER_NAME }}" | sed 's/patria-api/patria-worker/')
          ssh ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "\
            if [ -d ${WORKER_DIR} ]; then \
              cd ${WORKER_DIR} && npx prisma generate 2>/dev/null && \
              systemctl restart ${WORKER_SVC} 2>/dev/null || true; \
            fi"

      - name: Health check
        run: |
          sleep 5
          STATUS=$(ssh ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:${{ vars.PORT }}/api/health || echo 'FAIL'")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed! Status: $STATUS"
            ssh ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "docker logs ${{ vars.CONTAINER_NAME }} --tail 20"
            exit 1
          fi
          echo "Health check passed (HTTP $STATUS)"

      - name: Cleanup R2
        if: always()
        run: |
          aws s3 rm s3://patria-deploys/${{ steps.artifact.outputs.FILE_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com 2>/dev/null || true
