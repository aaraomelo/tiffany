name: Deploy Patria API

on:
  push:
    branches: [main, homolog, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'PROD' || github.ref_name == 'homolog' && 'HOMOLOG' || 'DEV' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: patria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pre-deploy validation
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/patria_test
          API_KEY_PATRICIA: test_key
          API_KEY_WORKER: test_key
          API_KEY_ADMIN: test_key
          PORT: "8080"
        run: |
          npx prisma migrate deploy 2>&1 | tee /tmp/validation.log
          mkdir -p public
          node dist/main.js > /tmp/app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health 2>/dev/null || echo '000')
            if [ "$STATUS" = "200" ]; then break; fi
            echo "Waiting for app to start... ($i/15)"
            sleep 2
          done
          kill $APP_PID 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "App startup log:" >> /tmp/validation.log
            cat /tmp/app.log >> /tmp/validation.log 2>/dev/null || true
            echo "❌ Pre-deploy validation failed: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Pre-deploy validation passed (HTTP $STATUS)"

      - name: Create deploy artifact
        id: artifact
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          FILE_NAME=patria-api-${{ github.ref_name }}-${TIMESTAMP}.tar.gz
          tar -czf $FILE_NAME dist prisma package.json package-lock.json Dockerfile .dockerignore PRODUCT.md SOUL.md
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Install AWS CLI
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Upload to R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto
          aws s3 cp ${{ steps.artifact.outputs.FILE_NAME }} \
            s3://patria-deploys/${{ steps.artifact.outputs.FILE_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Generate presigned URL
        id: presign
        run: |
          URL=$(aws s3 presign s3://patria-deploys/${{ steps.artifact.outputs.FILE_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --expires-in 1800)
          echo "DOWNLOAD_URL=$URL" >> $GITHUB_OUTPUT

      - name: Check for schema changes
        id: schema
        run: |
          COUNT=$(git diff --name-only HEAD~1 HEAD -- prisma/ | wc -l)
          echo "changed=$COUNT" >> $GITHUB_OUTPUT

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host server" >> ~/.ssh/config
          echo "  HostName ${{ vars.SSH_HOST }}" >> ~/.ssh/config
          echo "  User ${{ vars.SSH_USER }}" >> ~/.ssh/config
          echo "  ConnectTimeout 30" >> ~/.ssh/config
          echo "  ServerAliveInterval 15" >> ~/.ssh/config
          echo "  ServerAliveCountMax 3" >> ~/.ssh/config
          for i in 1 2 3; do
            ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done

      - name: Create deploy script
        run: |
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          DEPLOY_DIR="$1"
          COMPOSE_FILE="$2"
          CONTAINER_NAME="$3"
          PORT="$4"
          RUN_MIGRATION="$5"
          DATABASE_URL="$6"

          echo "⬇️ Downloading from R2..."
          URL=$(cat /tmp/download_url.txt)
          curl -sfL "$URL" -o /tmp/patria-api-deploy.tar.gz
          rm -f /tmp/download_url.txt

          echo "📦 Extracting..."
          mkdir -p $DEPLOY_DIR
          tar -xzf /tmp/patria-api-deploy.tar.gz -C $DEPLOY_DIR
          rm -f /tmp/patria-api-deploy.tar.gz

          if [ "$RUN_MIGRATION" = "1" ]; then
            echo "🔄 Running migrations..."
            cd $DEPLOY_DIR
            npm install prisma@5.22.0 --no-save 2>/dev/null
            DATABASE_URL=$DATABASE_URL npx prisma migrate deploy

            echo "🔄 Syncing worker Prisma..."
            WORKER_DIR=$(echo "$DEPLOY_DIR" | sed 's/patria-api/patria-worker/')
            WORKER_SVC=$(echo "$CONTAINER_NAME" | sed 's/patria-api/patria-worker/')
            if [ -d "$WORKER_DIR" ]; then
              cd "$WORKER_DIR" && npx prisma generate 2>/dev/null
              systemctl restart "$WORKER_SVC" 2>/dev/null || true
            fi
          fi

          echo "🐳 Building and restarting..."
          cd $DEPLOY_DIR && mkdir -p public
          docker compose -f $COMPOSE_FILE build $CONTAINER_NAME
          docker compose -f $COMPOSE_FILE up -d --force-recreate $CONTAINER_NAME

          echo "🔍 Health check..."
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/api/health || echo 'FAIL')
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: $STATUS"
            docker logs $CONTAINER_NAME --tail 20
            exit 1
          fi
          echo "✅ Deploy OK (HTTP $STATUS)"
          SCRIPT

      - name: Deploy via single SSH
        run: |
          echo '${{ steps.presign.outputs.DOWNLOAD_URL }}' > /tmp/download_url.txt
          for i in 1 2 3; do
            scp /tmp/download_url.txt /tmp/deploy.sh server:/tmp/ && \
            ssh server "chmod +x /tmp/deploy.sh && bash /tmp/deploy.sh '${{ vars.DEPLOY_DIR }}' '${{ vars.COMPOSE_FILE }}' '${{ vars.CONTAINER_NAME }}' '${{ vars.PORT }}' '${{ steps.schema.outputs.changed != '0' && '1' || '0' }}' '${{ vars.DATABASE_URL }}' && rm -f /tmp/deploy.sh" && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Report deploy failure
        if: failure()
        run: |
          API_HOST=${{ github.ref_name == 'main' && 'patria.patriatechnology.com' || github.ref_name == 'homolog' && 'patria.homolog.patriatechnology.com' || 'patria.dev.patriatechnology.com' }}
          DIAG=$(cat /tmp/validation.log 2>/dev/null | tail -50 || echo 'Pre-deploy validation failed')
          PAYLOAD=$(jq -n --arg sha "${{ github.sha }}" --arg diag "$DIAG" '{commitSha: $sha, diagnostic: $diag}')
          curl -sf -X POST "https://$API_HOST/api/webhooks/deploy-diagnostic" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      - name: Cleanup R2
        if: always()
        run: |
          aws s3 rm s3://patria-deploys/${{ steps.artifact.outputs.FILE_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com 2>/dev/null || true
